<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabu YouTube 助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Fabu YouTube 助手</h1>
  <p>仅在 Fabu 下载任务需要登录时，读取当前 Chrome 用户的 YouTube 登录态。不读取其他网站的信息。</p>
  <p id="status" role="status" aria-live="polite">正在检查本机连接…</p>
  <div class="actions">
    <button id="enable" type="button" disabled>启用连接</button>
    <button id="disable" type="button" disabled>停用并撤销权限</button>
    <button id="refresh" type="button">刷新连接状态</button>
  </div>
  <p class="note">请在已经登录 YouTube 的 Chrome 中启用。停用后断开本机助手并撤销 YouTube 权限，不会自行重新启用。</p>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
