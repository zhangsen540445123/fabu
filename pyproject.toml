[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fabu"
version = "0.2.0"
description = "Local-first video processing and verified publishing"
requires-python = ">=3.12"
dependencies = ["yt-dlp[default]==2026.10.26", "pydantic>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psutil>=7,<8", "pillow>=11,<13", "fonttools==4.68.0", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx2==2.16.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["media: real FFmpeg media integration", "live: externally authorized live operation"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
fabu = ["migrations/*.sql"]
