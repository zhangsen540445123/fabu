[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fabu"
version = "0.1.0"
description = "Local Windows video publishing assistant"
requires-python = ">=3.12"
dependencies = [
  "psutil==7.2.2",
  "pywinauto==0.6.9; sys_platform == 'win32'",
  "pywin32==312; sys_platform == 'win32'",
  "comtypes==1.4.17; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.15.6"]

[project.scripts]
fabu = "fabu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
